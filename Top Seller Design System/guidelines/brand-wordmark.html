<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/><style>html,body{margin:0}body{padding:18px 22px;background:var(--surface-page);font-family:var(--font-body);color:var(--text-body)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}

</div></body></html>
