<!-- @dsCard group="Colors" viewport="700x110" name="Neutral / Ink ramp" subtitle="--ts-ink-50 → 900" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/><style>
  html,body{margin:0}
  body{padding:18px 20px;background:var(--surface-page);font-family:var(--font-body);color:var(--text-body)}
  .swrow{display:flex;gap:10px;flex-wrap:wrap}
  .sw{flex:1;min-width:0;border-radius:var(--radius-md);border:1px solid var(--border-subtle);overflow:hidden}
  .sw .chip{height:54px}
  .sw .meta{padding:7px 9px}
  .sw .name{font-family:var(--font-display);font-weight:800;font-size:12px;color:var(--text-strong)}
  .sw .hex{font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums}
  .sw .chip{height:46px}.sw .name{font-size:11px}
</style></head><body><div class="swrow">
<div class="sw"><div class="chip" style="background:var(--ts-ink-50);border-bottom:1px solid var(--border-subtle)"></div><div class="meta"><div class="name">50</div><div class="hex">#F7F9F9</div></div></div><div class="sw"><div class="chip" style="background:var(--ts-ink-100)"></div><div class="meta"><div class="name">100</div><div class="hex">#EEF1F1</div></div></div><div class="sw"><div class="chip" style="background:var(--ts-ink-200)"></div><div class="meta"><div class="name">200</div><div class="hex">#DFE3E3</div></div></div><div class="sw"><div class="chip" style="background:var(--ts-ink-300)"></div><div class="meta"><div class="name">300</div><div class="hex">#BFC5C6</div></div></div><div class="sw"><div class="chip" style="background:var(--ts-ink-400)"></div><div class="meta"><div class="name">400</div><div class="hex">#939B9C</div></div></div><div class="sw"><div class="chip" style="background:var(--ts-ink-500)"></div><div class="meta"><div class="name">500</div><div class="hex">#6B7374</div></div></div><div class="sw"><div class="chip" style="background:var(--ts-ink-600)"></div><div class="meta"><div class="name">600</div><div class="hex">#4A5253</div></div></div><div class="sw"><div class="chip" style="background:var(--ts-ink-700)"></div><div class="meta"><div class="name">700</div><div class="hex">#2A3233</div></div></div><div class="sw"><div class="chip" style="background:var(--ts-ink-800)"></div><div class="meta"><div class="name">800</div><div class="hex">#161E1F</div></div></div><div class="sw"><div class="chip" style="background:var(--ts-ink-900)"></div><div class="meta"><div class="name">900</div><div class="hex">#081010</div></div></div>
</div></body></html>
