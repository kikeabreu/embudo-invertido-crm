<!-- @dsCard group="Colors" viewport="700x120" name="Brand core" subtitle="Morado · Naranja · Negro · Blanco" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/><style>
  html,body{margin:0}
  body{padding:18px 20px;background:var(--surface-page);font-family:var(--font-body);color:var(--text-body)}
  .swrow{display:flex;gap:10px;flex-wrap:wrap}
  .sw{flex:1;min-width:0;border-radius:var(--radius-md);border:1px solid var(--border-subtle);overflow:hidden}
  .sw .chip{height:54px}
  .sw .meta{padding:7px 9px}
  .sw .name{font-family:var(--font-display);font-weight:800;font-size:12px;color:var(--text-strong)}
  .sw .hex{font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums}
  
</style></head><body><div class="swrow">
<div class="sw"><div class="chip" style="background:var(--ts-purple)"></div><div class="meta"><div class="name">Morado</div><div class="hex">#7060D8</div></div></div>
<div class="sw"><div class="chip" style="background:var(--ts-orange)"></div><div class="meta"><div class="name">Naranja</div><div class="hex">#F08048</div></div></div>
<div class="sw"><div class="chip" style="background:var(--ts-black)"></div><div class="meta"><div class="name">Negro</div><div class="hex">#081010</div></div></div>
<div class="sw"><div class="chip" style="background:var(--ts-white);border-bottom:1px solid var(--border-subtle)"></div><div class="meta"><div class="name">Blanco</div><div class="hex">#FFFFFF</div></div></div>
</div></body></html>
