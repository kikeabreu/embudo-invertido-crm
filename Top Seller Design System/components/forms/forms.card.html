<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--surface-page); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 20px; align-items: center; max-width: 640px; }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Input, Select, Checkbox, Switch } = window.TopSellerDesignSystem_57ba3c;
  const Search = () => (
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5" stroke="currentColor" strokeWidth="2"/><path d="M11 11l3 3" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>
  );
  function Demo() {
    const [on, setOn] = React.useState(true);
    const [check, setCheck] = React.useState(true);
    return (
      <div className="grid">
        <div className="stack">
          <Input placeholder="Full name" defaultValue="Ana Ríos" />
          <Input iconLeft={<Search/>} placeholder="Search leads…" />
          <Input placeholder="Invalid field" invalid defaultValue="—" />
        </div>
        <div className="stack">
          <Select defaultValue="b">
            <option value="a">Cold lead</option>
            <option value="b">Qualified</option>
            <option value="c">Closed — won</option>
          </Select>
          <div className="row">
            <Checkbox checked={check} onChange={setCheck} label="Email opt-in" />
            <Checkbox checked={false} label="SMS opt-in" />
          </div>
          <div className="row">
            <Switch checked={on} onChange={setOn} />
            <Switch checked={false} />
            <Switch checked size="sm" />
          </div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script>
</body>
</html>
