<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--surface-page); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .panel { display: flex; align-items: center; justify-content: center; gap: 22px; padding: 22px; border-radius: var(--radius-lg); border: 1px solid var(--border-subtle); }
  .dark { background: var(--ts-black); border-color: transparent; }
  .brand { background: var(--ts-purple); border-color: transparent; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Logo } = window.TopSellerDesignSystem_57ba3c;
  const base = "../../assets/logos";
  function Demo() {
    return (
      <div className="grid">
        <div className="panel"><Logo color="purple" height={26} assetBase={base}/><Logo variant="mark" color="purple" height={44} assetBase={base}/></div>
        <div className="panel"><Logo color="black" height={26} assetBase={base}/><Logo variant="mark" color="black" height={44} assetBase={base}/></div>
        <div className="panel dark"><Logo color="white" height={26} assetBase={base}/><Logo variant="mark" color="white" height={44} assetBase={base}/></div>
        <div className="panel brand"><Logo color="white" height={26} assetBase={base}/><Logo variant="mark" color="white" height={44} assetBase={base}/></div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script>
</body>
</html>
