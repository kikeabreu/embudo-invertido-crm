<!-- @startingPoint section="Sistema Referente" subtitle="Landing page de venta (hero → oferta → precio)" viewport="1200x900" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Top Seller — Sistema Referente Inmobiliario™</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  html, body { margin: 0; background: var(--surface-card); scroll-behavior: smooth; }
  a { text-decoration: none; }
  a:hover { text-decoration: none; opacity: .8; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="Sections.jsx"></script>
<script type="text/babel">
  function App() {
    const { Nav, Hero, Enemigo, Sistema, Valor, Avatares, Garantia, Precio, Footer } = window.TSLanding;
    const apply = () => {
      const el = document.getElementById("precio");
      if (el) window.scrollTo({ top: el.offsetTop, behavior: "smooth" });
    };
    return (
      <div>
        <Nav onApply={apply} />
        <Hero onApply={apply} />
        <Enemigo />
        <Sistema />
        <Valor />
        <Avatares />
        <Garantia />
        <Precio onApply={apply} />
        <Footer />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
